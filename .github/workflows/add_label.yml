name: "Component: Add Label to PR"
on:
  workflow_call:
    inputs:
      label-name:
        description: "The name of the label to add"
        required: true
        type: string

jobs:
  add-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ inputs.label-name }}
        run: gh pr edit $PR_NUMBER --add-label "$LABEL"
