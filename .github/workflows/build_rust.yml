name: Build Rust library
on:
  issue_comment:
    types: [created]

jobs:
  check-command:
    uses: ./.github/workflows/comment_handler.yml
    secrets: inherit
    with:
      comment-body: "!build_rust"

  build-rust:
    needs: check-command
    if: needs.check-command.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: create_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - run: |
          echo "GH_TOKEN=${{ steps.create_token.outputs.token }}" >> "$GITHUB_ENV"
          echo "FAIL_NOTIFIED=false" >> "$GITHUB_ENV"
        shell: bash

      - name: PR Data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pr_json=$(gh api "${{ github.event.issue.pull_request.url }}")
          if [[ $(jq -r '.maintainer_can_modify' <<<"$pr_json") == "false" ]]; then
            gh pr comment ${{ github.event.issue.html_url }} --body 'GitHub Actions cannot push to the repository unless "Allow edits and access to secrets by maintainers" is checked.'
            echo "FAIL_NOTIFIED=true" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "PR_REPO=$(jq -r '.head.repo.full_name' <<<"$pr_json")" >> "$GITHUB_ENV"
          echo "PR_BRANCH=$(jq -r '.head.ref' <<<"$pr_json")" >> "$GITHUB_ENV"
          echo "PR_HEAD_LABEL=$(jq -r '.head.label' <<<"$pr_json")" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.PR_REPO }}
          ref: ${{ env.PR_BRANCH }}
          token: ${{ env.GH_TOKEN }}

      - name: Build rustlibs
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          git config user.name "paradisess13[bot]"
          git config user.email "165046124+paradisess13[bot]@users.noreply.github.com"

          rustup target add i686-unknown-linux-gnu
          rustup target add i686-pc-windows-gnu
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev:i386 lib32gcc-s1 mingw-w64 mingw-w64-i686-dev

          tools/ci/build_all_rustlibs.sh

          git commit -a -m "Build Rust library" --allow-empty
          git push origin HEAD:${{ env.PR_BRANCH }}

      - name: Notify Failure
        if: failure() && env.FAIL_NOTIFIED != 'true'
        run: |
          gh pr comment ${{ github.event.issue.html_url }} --body "Building Rust library failed. See the [action run log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
